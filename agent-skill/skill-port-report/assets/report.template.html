<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skill Port · 本地项目列表</title>
<style>
:root{color-scheme:dark;--bg:#101014;--panel:#16161c;--text:#efebe4;--muted:#aaa59e;--border:#34343e;--accent:#5fa8a0;--warm:#c8603c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.7 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}main{max-width:1120px;margin:auto;padding:48px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid var(--border);padding-bottom:24px}.brand{color:var(--accent);letter-spacing:.16em;font-size:12px}h1{font-family:"Songti SC",SimSun,serif;font-size:32px;margin:8px 0}p{color:var(--muted);margin:8px 0}.stats{display:flex;gap:32px;margin:28px 0;flex-wrap:wrap}.stat strong{display:block;font:36px/1.3 Consolas,monospace;color:var(--accent)}.stat span{color:var(--muted);font-size:13px}input,button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:10px 14px}input{width:min(100%,460px)}button{cursor:pointer}button:hover{border-color:var(--accent)}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.tools{display:flex;gap:12px;margin:24px 0}.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px}table{width:100%;border-collapse:collapse;background:var(--panel)}th,td{text-align:left;padding:18px 20px;border-bottom:1px solid var(--border)}th{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}tbody tr:last-child td{border-bottom:0}td strong{display:block;font-size:17px}code{font:13px/1.7 Consolas,monospace;color:var(--muted);overflow-wrap:anywhere}.count{color:var(--accent);font:22px Consolas,monospace;text-align:right}.date{white-space:nowrap;color:var(--muted)}#empty{padding:32px;text-align:center;color:var(--muted)}[hidden]{display:none!important}footer{border-top:1px solid var(--border);margin-top:32px;padding-top:18px;color:var(--muted);font-size:12px}#result{font-size:13px;color:var(--muted);margin-top:12px}noscript{color:var(--warm)}@media(max-width:600px){main{padding:24px 16px}h1{font-size:26px}.stats{gap:22px}th,td{padding:12px}header{align-items:flex-start}.tools{flex-wrap:wrap}.date{white-space:normal}table{min-width:0}td:first-child{max-width:180px}td strong{overflow-wrap:anywhere}}
</style>
</head>
<body><main>
<header><div><div class="brand">SKILL PORT / LOCAL PROJECTS</div><h1>本地项目列表</h1><p>仅展示 Hub 已登记项目，不扫描磁盘、不登记当前目录。</p></div></header>
<section class="stats" aria-label="登记与启用统计"><div class="stat"><strong id="projectCount">—</strong><span>已登记项目</span></div><div class="stat"><strong id="projectEnablementCount">—</strong><span>项目启用点</span></div><div class="stat"><strong id="globalCount">—</strong><span>全局启用点（不计入项目）</span></div></section>
<div class="tools"><input id="q" type="search" placeholder="搜索项目名称或路径…" aria-label="搜索项目"><button id="reset" type="button">重置</button></div>
<div class="table-wrap"><table><thead><tr><th>本地项目 / 路径</th><th>登记时间</th><th>项目启用数</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" hidden>没有匹配的已登记项目。</div></div>
<div id="result" aria-live="polite"></div><noscript>请允许 JavaScript 以显示内联的项目快照。</noscript>
<footer><div id="updated"></div><div>数据来源：Hub state.db 的只读事务快照 · 启用数是登记的 enablement 数量，不是实时健康诊断。</div><div>本页面包含本地项目路径，仅供本机查看，请勿公开发布。单文件离线页面，无外部依赖。</div></footer>
</main>
<!-- SKILL_PORT_DATA -->
<script>
(() => {
  'use strict';
  const data = window.SKILL_PORT_DATA;
  const $ = id => document.getElementById(id);
  document.title = data.meta.title;
  $('projectCount').textContent = data.projects.length;
  $('projectEnablementCount').textContent = data.projects.reduce((n,p)=>n+p.enablementCount,0);
  $('globalCount').textContent = data.globalEnablementCount;
  $('updated').textContent = '快照时间：' + data.meta.updated;
  const rows = data.projects.map(project => {
    const tr = document.createElement('tr');
    tr.dataset.project = project.path;
    const title = document.createElement('td');
    const name = document.createElement('strong'); name.textContent = project.name;
    const path = document.createElement('code'); path.textContent = project.path;
    title.append(name,path);
    const date = document.createElement('td'); date.className = 'date'; date.textContent = project.registeredAt.slice(0,10); date.title = project.registeredAt;
    const count = document.createElement('td'); count.className = 'count'; count.textContent = project.enablementCount;
    tr.append(title,date,count); $('rows').append(tr);
    return {tr,hay:(project.name+' '+project.path).toLowerCase()};
  });
  function filter(){const term=$('q').value.trim().toLowerCase();let count=0;for(const row of rows){row.tr.hidden=!row.hay.includes(term);if(!row.tr.hidden)count++;}$('empty').hidden=count!==0;$('result').textContent='显示 '+count+' / '+rows.length+' 个项目';}
  $('q').addEventListener('input',filter);
  $('reset').addEventListener('click',()=>{$('q').value='';filter();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('q').value='';filter();}if(e.key==='/'&&document.activeElement!==$('q')){e.preventDefault();$('q').focus();}});
  filter();
})();
</script>
</body>
</html>
