<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skill Port · 已安装 Skill 清册</title>
<style>
:root{
  color-scheme:light;
  --bg:#f3f1eb;--bg-accent:#e7efe9;--surface:#fffcf7;--surface-alt:#f7f4ee;--surface-hover:#eef6f2;--surface-muted:#ebe6dc;
  --border:#d8d2c6;--border-strong:#b9b2a4;--border-hover:#5f8f86;
  --text:#1c1b19;--text-secondary:#5c574e;--text-tertiary:#8a8376;
  --accent:#2f6f66;--accent-hover:#245851;--accent-soft:#d7ebe6;--accent-ink:#1f4f48;
  --bg-rgb:243,241,235;--surface-rgb:255,252,247;--accent-rgb:47,111,102;--text-rgb:28,27,25;
  --success:#2f6f66;--warning:#9a6b2f;--error:#a3463a;--focus-ring:rgba(47,111,102,.35);
  --font-display:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","STSong",serif;
  --font-body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --font-mono:"SF Mono",Menlo,Consolas,"Sarasa Mono SC",monospace;
}
*{box-sizing:border-box}
body{
  margin:0;
  color:var(--text);
  font:15px/1.75 var(--font-body);
  letter-spacing:.02em;
  background:
    radial-gradient(1200px 520px at 12% -10%,var(--bg-accent),transparent 60%),
    radial-gradient(900px 480px at 100% 0%,#efe8dc,transparent 55%),
    var(--bg);
}
main{max-width:1120px;margin:0 auto;padding:48px 24px}
header{padding-bottom:24px;border-bottom:1px solid var(--border)}
.brand{
  display:inline-flex;align-items:center;gap:10px;
  color:var(--accent);font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
}
.brand::before{content:"";width:18px;height:2px;background:var(--accent)}
h1{
  margin:10px 0 8px;font-family:var(--font-display);font-size:clamp(28px,4vw,40px);
  font-weight:700;line-height:1.25;letter-spacing:.02em;color:var(--text);
}
.lead{margin:0;max-width:46em;color:var(--text-secondary);font-size:15px;line-height:1.75}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:28px 0 24px}
.stat{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:18px 20px;box-shadow:0 1px 0 rgba(28,27,25,.04);
  transition:border-color 160ms ease,background-color 160ms ease;
}
.stat:hover{border-color:var(--border-hover);background:var(--surface-hover)}
.stat strong{
  display:block;font-family:var(--font-mono);font-size:clamp(28px,3vw,36px);
  font-weight:600;line-height:1.2;letter-spacing:-.02em;color:var(--accent-ink);
}
.stat span{display:block;margin-top:6px;color:var(--text-secondary);font-size:12px;font-weight:500;letter-spacing:.04em}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:0 0 20px}
.field,.btn{
  font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);
  border-radius:8px;padding:10px 14px;min-height:44px;
  transition:border-color 160ms ease,box-shadow 160ms ease,background-color 160ms ease,color 160ms ease;
}
.field{flex:1 1 280px;min-width:min(100%,240px)}
.field-narrow{flex:0 1 200px}
.field::placeholder{color:var(--text-tertiary)}
.field:hover,.btn:hover{border-color:var(--border-hover);background:var(--surface-hover);color:var(--accent-ink)}
.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--focus-ring);background:var(--surface)}
.btn{cursor:pointer;padding-inline:16px}
.btn:active{background:var(--accent-soft);transform:translateY(1px)}
.btn:focus-visible,:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.btn:disabled,.field:disabled{opacity:.45;cursor:not-allowed}
.table-shell{
  border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--surface);
  box-shadow:0 1px 0 rgba(28,27,25,.04);
}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:16px 18px;vertical-align:top}
th{
  font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-tertiary);background:var(--surface-alt);border-bottom:1px solid var(--border);white-space:nowrap;
}
td{border-bottom:1px solid var(--border)}
tbody tr{transition:background-color 140ms ease}
tbody tr:hover{background:var(--surface-hover)}
tbody tr:last-child td{border-bottom:0}
.skill-name{display:block;font-size:16px;font-weight:650;line-height:1.4;color:var(--text)}
.desc{margin-top:4px;color:var(--text-secondary);font-size:13px;line-height:1.7}
.cat{font-family:var(--font-mono);font-size:12px;color:var(--accent-ink);white-space:nowrap}
.date{white-space:nowrap;color:var(--text-tertiary);font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{
  display:inline-flex;padding:1px 8px;border-radius:4px;border:1px solid var(--border);
  color:var(--text-tertiary);font-size:12px;background:var(--surface);
}
#empty{padding:40px 24px;text-align:center;color:var(--text-secondary);background:var(--surface-alt)}
[hidden]{display:none!important}
#result{margin-top:12px;font-size:13px;color:var(--text-tertiary)}
footer{margin-top:36px;padding-top:18px;border-top:1px solid var(--border);color:var(--text-tertiary);font-size:12px;line-height:1.7}
footer div+div{margin-top:4px}
noscript{color:var(--error)}
.enter-1{animation:rise-in 420ms ease both}
.enter-2{animation:rise-in 420ms ease 80ms both}
.enter-3{animation:rise-in 420ms ease 140ms both}
@keyframes rise-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media (max-width:700px){
  main{padding:24px 16px}
  h1{font-size:28px}
  .stats{grid-template-columns:1fr;gap:12px}
  .tools{flex-direction:column;align-items:stretch}
  .field,.btn{width:100%;flex:none}
  .date{white-space:normal}
  table{min-width:520px}
  th,td{padding:12px 14px}
}
</style>
</head>
<body><main>
<header class="enter-1">
  <div class="brand">Skill Port / Installed Skills</div>
  <h1>已安装 Skill 清册</h1>
  <p class="lead">只读快照 Hub 已安装 Skill；不含来源路径与项目路径。</p>
</header>
<section class="stats enter-2" aria-label="安装与启用统计">
  <div class="stat"><strong id="skillCount">—</strong><span>已安装 Skill</span></div>
  <div class="stat"><strong id="enabledCount">—</strong><span>至少一处启用</span></div>
  <div class="stat"><strong id="enablementCount">—</strong><span>启用点合计</span></div>
</section>
<div class="tools enter-3">
  <input id="q" class="field" type="search" placeholder="搜索名称、描述或标签…" aria-label="搜索 Skill">
  <select id="category" class="field field-narrow" aria-label="按分类筛选"><option value="">全部分类</option></select>
  <button id="reset" class="btn" type="button">重置</button>
</div>
<div class="table-shell">
  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>技能</th><th>分类</th><th>安装时间</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div id="empty" hidden>没有匹配的已安装 Skill。</div>
</div>
<div id="result" aria-live="polite"></div>
<noscript>请允许 JavaScript 以显示内联的 Skill 快照。</noscript>
<footer>
  <div id="updated"></div>
  <div>数据来源：Hub state.db 的只读事务快照 · 顶部启用统计是登记数量，不是实时健康诊断 · 展示分类与中文描述来自报告内置映射，不修改 Hub。</div>
  <div>本页面属于本地私有报告，仅供本机查看，请勿公开发布。单文件离线页面，无外部依赖。</div>
</footer>
</main>
<!-- SKILL_PORT_DATA -->
<script>
(() => {
  'use strict';
  const data = window.SKILL_PORT_DATA;
  const $ = id => document.getElementById(id);
  const categoryByKey = Object.fromEntries((data.categories || []).map(c => [c.key, c]));
  document.title = data.meta.title;
  $('skillCount').textContent = data.skills.length;
  $('enabledCount').textContent = data.skills.filter(s => s.enablementCount > 0).length;
  $('enablementCount').textContent = data.skills.reduce((n, s) => n + s.enablementCount, 0);
  $('updated').textContent = '快照时间：' + data.meta.updated;
  const categorySelect = $('category');
  for (const cat of data.categories || []) {
    const option = document.createElement('option');
    option.value = cat.key;
    option.textContent = cat.label;
    categorySelect.append(option);
  }
  const rows = data.skills.map(skill => {
    const tr = document.createElement('tr');
    tr.dataset.skill = skill.name;
    tr.dataset.category = skill.category;

    const title = document.createElement('td');
    const name = document.createElement('strong');
    name.className = 'skill-name';
    name.textContent = skill.name;
    const desc = document.createElement('div');
    desc.className = 'desc';
    desc.textContent = skill.description;
    title.append(name, desc);
    if (skill.tags && skill.tags.length) {
      const tags = document.createElement('div');
      tags.className = 'tags';
      for (const value of skill.tags) {
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = value;
        tags.append(tag);
      }
      title.append(tags);
    }

    const cat = document.createElement('td');
    cat.className = 'cat';
    const catInfo = categoryByKey[skill.category];
    cat.textContent = catInfo ? catInfo.label : skill.category;
    cat.title = catInfo ? catInfo.title : skill.category;

    const date = document.createElement('td');
    date.className = 'date';
    date.textContent = skill.installedAt.slice(0, 10);
    date.title = skill.installedAt;

    tr.append(title, cat, date);
    $('rows').append(tr);
    return {
      tr,
      hay: (skill.name + ' ' + skill.description + ' ' + (skill.tags || []).join(' ')).toLowerCase(),
      category: skill.category
    };
  });

  function filter() {
    const term = $('q').value.trim().toLowerCase();
    const category = $('category').value;
    let count = 0;
    for (const row of rows) {
      const match = (!term || row.hay.includes(term)) && (!category || row.category === category);
      row.tr.hidden = !match;
      if (match) count++;
    }
    $('empty').hidden = count !== 0;
    $('result').textContent = '显示 ' + count + ' / ' + rows.length + ' 个 Skill';
  }
  function reset() {
    $('q').value = '';
    $('category').value = '';
    filter();
  }
  $('q').addEventListener('input', filter);
  $('category').addEventListener('change', filter);
  $('reset').addEventListener('click', reset);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') reset();
    if (e.key === '/' && document.activeElement !== $('q')) {
      e.preventDefault();
      $('q').focus();
    }
  });
  filter();
})();
</script>
</body>
</html>
